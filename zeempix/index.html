<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZEEMPIX ENTERPRISE – Admin</title>
<style>
:root{--bg:#fff;--fg:#0a0a0a;--card:#f4f4f4;--line:#e0e0e0;--mute:#6b6b6b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f5f5f5;--card:#141414;--line:#2a2a2a;--mute:#9a9a9a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--fg:#f5f5f5;--card:#141414;--line:#2a2a2a;--mute:#9a9a9a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:880px;margin:0 auto;padding:28px 20px 60px}
.top{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center;font-weight:700;letter-spacing:.18em;font-size:.8rem}
.tg{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;font:inherit;font-size:.75rem;letter-spacing:.05em}
.hero{text-align:center;padding:72px 0 40px}
.hero small{color:var(--mute);letter-spacing:.3em;font-size:.72rem}
h1{font-size:clamp(2rem,6vw,3.4rem);margin:14px 0 10px;line-height:1.1;letter-spacing:-.02em}
.hero p{color:var(--mute);margin:0}
.nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:34px}
.btn{background:var(--fg);color:var(--bg);border:0;border-radius:22px;padding:22px 16px;font:inherit;font-weight:600;font-size:1rem;cursor:pointer;transition:transform .2s,opacity .2s}
.btn:hover{transform:translateY(-3px);opacity:.88}
.btn.alt{background:var(--card);color:var(--fg);border:1px solid var(--line)}
#cal{display:none;margin-top:40px;animation:in .5s ease}
#cal.show{display:block}
.months{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.m{flex:0 0 auto;border:1px solid transparent;background:var(--c);color:#111;border-radius:999px;padding:8px 16px;cursor:pointer;font:inherit;font-size:.85rem;transition:.25s}
.m{position:relative}.m:hover{transform:translateY(-2px)}
.m.soon::after{content:"";position:absolute;top:3px;right:5px;width:8px;height:8px;border-radius:50%;background:#e11;animation:bl2 1s infinite}
.ev{position:relative}
.ev.soon::after{content:"";position:absolute;inset:-1px;border:2px solid #e11;border-radius:22px;animation:bl2 1s infinite;pointer-events:none}
.bd{display:inline-block;margin-top:10px;font-style:normal;font-size:.72rem;background:#e11;color:#fff;border-radius:999px;padding:3px 10px}
.clk{letter-spacing:0;font-weight:500;text-align:right;font-size:.75rem;line-height:1.35;margin-right:10px}
.rt{display:flex;align-items:center;gap:6px}
@keyframes bl2{50%{opacity:.15}}
.m.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--fg);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:18px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;cursor:pointer;opacity:0;transform:translateY(14px);animation:in .5s ease forwards;transition:border-color .2s,transform .2s}
.ev:hover{border-color:var(--fg)}
.ev b{display:block;font-size:1.8rem}
.ev span{color:var(--mute);font-size:.9rem;line-height:1.4;display:block;margin-top:6px}
.empty{color:var(--mute);padding:30px;text-align:center;grid-column:1/-1}
#det{display:none;margin-top:18px;border:1px solid var(--fg);border-radius:22px;padding:24px}
#det.show{display:block;animation:in .45s ease}
#det h3{margin:0 0 4px;font-size:1.25rem}
#det em{color:var(--mute);font-style:normal;font-size:.85rem}
#typ{margin:14px 0 0;line-height:1.65;min-height:3em}
#typ::after{content:"▍";animation:bl 1s infinite}
@keyframes in{to{opacity:1;transform:none}from{opacity:0;transform:translateY(14px)}}
@keyframes bl{50%{opacity:0}}
.ft{text-align:center;color:var(--mute);font-size:.72rem;margin-top:60px;letter-spacing:.15em}
/* === LOCK SCREEN === */
#lock{position:fixed;inset:0;z-index:99999;background:#000;color:#f5f5f5;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#lock.hide{display:none}
.lk{width:100%;max-width:360px;text-align:center;background:#111;border:1px solid #2a2a2a;border-radius:28px;padding:36px 28px}
.lk small{color:#9a9a9a;letter-spacing:.3em;font-size:.68rem}
.lk h2{margin:10px 0 24px;font-size:1.3rem;letter-spacing:.05em}
.lk input{width:100%;background:#000;border:1px solid #2a2a2a;color:#fff;border-radius:16px;padding:14px 16px;font:inherit;outline:0;text-align:center;letter-spacing:.1em}
.lk input:focus{border-color:#fff}
.lk button{width:100%;margin-top:12px;background:#fff;color:#000;border:0;border-radius:16px;padding:14px;font:inherit;font-weight:600;cursor:pointer;transition:opacity .2s}
.lk button:hover{opacity:.85}
#lkErr{min-height:1.2em;margin-top:14px;color:#ff5a5a;font-size:.85rem}
.lk.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
body.locked #app{display:none}
body.locked{overflow:hidden}
/* === REMINDER === */
#rem{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-160%);width:min(92vw,420px);z-index:9000;background:#111;color:#f5f5f5;border:1px solid #e11;border-radius:22px;padding:16px 18px;box-shadow:0 10px 40px rgba(0,0,0,.4);transition:transform .5s cubic-bezier(.2,.9,.3,1)}
#rem.show{transform:translate(-50%,0)}
#rem b{display:block;margin-bottom:8px;font-size:.95rem}
#remTxt{font-size:.88rem;line-height:1.55;white-space:pre-line}
#remX{margin-top:12px;background:#fff;color:#000;border:0;border-radius:999px;padding:8px 18px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer}
</style>
</head>
<body class="locked">
<!-- LOCK SCREEN -->
<div id="lock">
 <div class="lk" id="lkBox">
  <small>ZEEMPIX ENTERPRISE</small>
  <h2>Akses Terhad</h2>
  <input type="password" id="lkPw" placeholder="Masukkan kata laluan" autocomplete="off" autofocus>
  <button id="lkBtn">Unlock</button>
  <div id="lkErr"></div>
 </div>
</div>
<div id="app">
<div class="wrap">
 <div class="top"><span>ZEEMPIX ENTERPRISE</span><div class="rt"><span class="clk" id="clk"></span><button class="tg" id="bell" title="Peringatan event">🔔</button><button class="tg" id="tg">◐ Tema</button></div></div>
 <section class="hero">
  <small>ADMIN PANEL · MEDIA KETENTERAAN</small>
  <h1>Welcome to Zeempix Managements</h1>
  <div class="nav">
   <button class="btn" id="bCal">Calendar</button>
   <button class="btn alt" data-k="socmed">SocMed</button>
   <button class="btn alt" data-k="bmc">BMC</button>
   <button class="btn alt" data-k="paper">PaperWork</button>
  </div>
 </section>
 <section id="cal">
  <div class="months" id="months"></div>
  <div class="grid" id="grid"></div>
  <div id="det"><h3 id="dt"></h3><em id="dm"></em><p id="typ"></p></div>
 </section>
 <div class="ft">© ZEEMPIX ENTERPRISE</div>
</div>
</div>
<div id="rem"><b>🔔 Peringatan: Event Hampir Tiba</b><div id="remTxt"></div><button id="remX">OK, faham</button></div>
<script>
// === LOCK LOGIC (password disimpan sebagai hash sahaja) ===
(function(){
 const H=["dcbksizsmw","21vsve5vaj3"];
 const hs=(s,seed=0)=>{let a=0xdeadbeef^seed,b=0x41c6ce57^seed;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
 const ok=p=>H.includes(hs("zx:"+p+":mpix"));
 const open=()=>{document.getElementById("lock").classList.add("hide");document.body.classList.remove("locked");document.dispatchEvent(new Event("zpx-open"))};
 try{if(sessionStorage.getItem("zpx")==="1")open()}catch(e){}
 const pw=document.getElementById("lkPw"),err=document.getElementById("lkErr"),box=document.getElementById("lkBox");
 function go(){
  if(ok(pw.value.trim())){try{sessionStorage.setItem("zpx","1")}catch(e){}open()}
  else{err.textContent="Kata laluan salah.";pw.value="";box.classList.remove("shake");void box.offsetWidth;box.classList.add("shake");pw.focus()}
 }
 document.getElementById("lkBtn").onclick=go;
 pw.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
 pw.addEventListener("input",()=>err.textContent="");
})();
// === Tukar link di sini ===
const LINKS={socmed:"https://docs.google.com/document/d/17cR4u1x_PAqHeQbW1blpdkC5Rc7NI_HTh8_0qQnXHXc/edit?tab=t.0#heading=h.fgiufekve70r",bmc:"https://docs.google.com/document/d/17cR4u1x_PAqHeQbW1blpdkC5Rc7NI_HTh8_0qQnXHXc/edit?tab=t.q71dennfmnb#heading=h.qizo49cyem0c",paper:"https://docs.google.com/document/d/17cR4u1x_PAqHeQbW1blpdkC5Rc7NI_HTh8_0qQnXHXc/edit?tab=t.avg1cl29ix0#heading=h.est24vebip02"};
const MN=["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];
const T={A:"Angkatan Tentera Malaysia",P:"Polis Diraja Malaysia",G:"Agensi Awam & Keselamatan"};
const E=[
[0,1,"Unit Tindakan Khas (UTK)","P"],[1,1,"Pasukan Gerakan Udara (PGU)","P"],
[2,1,"Tentera Darat Malaysia (TDM) & Rejimen Askar Melayu Diraja (RAMD)","A"],
[2,11,"Pasukan Udara Tentera Darat (PUTD)","A"],[2,24,"Hari Pertahanan Awam (APM)","G"],
[3,1,"Pasukan Khas Udara (PASKAU)","A"],[3,16,"Kor Agama Angkatan Tentera (KAGAT)","A"],
[3,22,"Rejimen Askar Jurutera Diraja (RAJD)","A"],[3,27,"Tentera Laut Diraja Malaysia (TLDM)","A"],
[4,1,"Kor Perkhidmatan Am (KPA)","A"],[4,4,"Hari Anggota Bomba","G"],[4,11,"Kor Kesihatan Diraja (KKD)","A"],
[5,1,"Tentera Udara Diraja Malaysia (TUDM) & Rejimen Askar Wataniah (AW)","A"],
[7,1,"Grup Gerak Khas (GGK)","A"],[7,15,"Rejimen Artileri Diraja (RAD)","A"],
[8,1,"Kor Armor Diraja (KAD) & Pasukan Polis Marin (PPM)","A"],
[8,16,"Angkatan Tentera Malaysia (ATM) & Rejimen Renjer Diraja (RRD)","A"],
[9,1,"Pasukan Khas Laut (PASKAL) & Hari SPRM","A"],[9,10,"10 Briged Para","A"],
[9,23,"Komando 69 (VAT 69)","P"],[10,7,"Kor Risik Diraja (KRD)","A"],
[10,11,"Hari Penjara Malaysia","G"],[10,12,"Kor Polis Tentera Diraja (KPTD)","A"],
[10,15,"Rejimen Semboyan Diraja (RSD)","A"],[11,5,"Pasukan Simpanan Persekutuan (FRU)","P"]];
const $=id=>document.getElementById(id);let cur=new Date().getMonth(),tm,soon={};
document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>window.open(LINKS[b.dataset.k],"_blank","noopener"));
$("bCal").onclick=()=>{$("cal").classList.toggle("show");if($("cal").classList.contains("show"))setTimeout(()=>$("cal").scrollIntoView({behavior:"smooth"}),50)};
MN.forEach((n,i)=>{const b=document.createElement("button");b.className="m";b.textContent=n;b.style.setProperty("--c","hsl("+(i*30)+" 75% 85%)");b.onclick=()=>show(i);$("months").appendChild(b)});
function show(m){
 cur=m;clearInterval(tm);$("det").classList.remove("show");
 [...$("months").children].forEach((b,i)=>{b.classList.toggle("on",i===m);b.classList.toggle("soon",Object.keys(soon).some(k=>+k.split("-")[0]===i))});
 const g=$("grid");g.innerHTML="";
 const ev=E.filter(e=>e[0]===m);
 if(!ev.length){g.innerHTML='<div class="empty">Tiada acara bulan ini.</div>';return}
 ev.forEach((e,i)=>{const c=document.createElement("div");c.className="ev";c.style.animationDelay=i*90+"ms";
  c.innerHTML="<b>"+e[1]+" "+MN[m].slice(0,3)+"</b><span></span>";c.lastChild.textContent=e[2];const n=soon[m+"-"+e[1]];if(n!==undefined){c.classList.add("soon");c.insertAdjacentHTML("beforeend","<i class=bd>"+(n?n+" hari lagi":"Hari ini")+"</i>")}
  c.onclick=()=>detail(e);g.appendChild(c)});
}
function detail(e){
 $("dt").textContent=e[2];$("dm").textContent=e[1]+" "+MN[e[0]]+" · "+T[e[3]];
 const txt="Tarikh "+e[1]+" "+MN[e[0]]+" diraikan sebagai hari ulang tahun penubuhan / sambutan "+e[2]+". Cabang: "+T[e[3]]+".";
 const d=$("det");d.classList.remove("show");void d.offsetWidth;d.classList.add("show");
 const t=$("typ");t.textContent="";clearInterval(tm);let i=0;
 const s=Math.ceil(txt.length/25);tm=setInterval(()=>{i+=s;t.textContent=txt.slice(0,i);if(i>=txt.length)clearInterval(tm)},20);
 setTimeout(()=>d.scrollIntoView({behavior:"smooth",block:"nearest"}),60);
}
// === Masa Malaysia (Kuala Lumpur) ===
const KL=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Kuala_Lumpur",year:"numeric",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
const DN=["Ahad","Isnin","Selasa","Rabu","Khamis","Jumaat","Sabtu"];let dayKey="";
function tick(){
 const o={};KL.formatToParts(new Date()).forEach(p=>o[p.type]=p.value);
 const t=Date.UTC(+o.year,o.month-1,+o.day),key=o.year+"-"+o.month+"-"+o.day;
 $("clk").innerHTML=DN[new Date(t).getUTCDay()]+", "+o.day+" "+MN[o.month-1]+" "+o.year+"<br>"+o.hour+":"+o.minute+":"+o.second+" MYT";
 if(key!==dayKey){
  soon={};E.forEach(e=>{let d=Date.UTC(+o.year,e[0],e[1]);if(d<t)d=Date.UTC(+o.year+1,e[0],e[1]);const n=Math.round((d-t)/864e5);if(n<=7)soon[e[0]+"-"+e[1]]=n});
  const first=!dayKey;dayKey=key;if(!first)show(cur);
 }
}
tick();setInterval(tick,1000);
show(cur);
// === Peringatan setiap 24 jam ===
const RK="zpx_rem";
function remList(){return Object.keys(soon).map(k=>{const a=k.split("-");return{m:+a[0],d:+a[1],n:soon[k]}}).sort((x,y)=>x.n-y.n).map(x=>{const e=E.find(v=>v[0]===x.m&&v[1]===x.d);return"• "+e[2]+" — "+(x.n?x.n+" hari lagi":"HARI INI")+" ("+x.d+" "+MN[x.m].slice(0,3)+")"})}
function toast(l){$("remTxt").textContent=l.join("\n");$("rem").classList.add("show")}
function sysNotify(l){try{if("Notification" in window&&Notification.permission==="granted")new Notification("ZEEMPIX: Event Hampir Tiba",{body:l.join("\n"),tag:"zpx"})}catch(e){}}
function remind(force){
 const l=remList();
 if(!l.length){if(force)toast(["Tiada event dalam 7 hari akan datang."]);return}
 let last=0;try{last=+localStorage.getItem(RK)||0}catch(e){}
 if(!force&&Date.now()-last<864e5)return;
 try{localStorage.setItem(RK,String(Date.now()))}catch(e){}
 toast(l);sysNotify(l);
}
$("remX").onclick=()=>$("rem").classList.remove("show");
$("bell").onclick=()=>{if("Notification" in window&&Notification.permission==="default"){Notification.requestPermission().then(()=>remind(true)).catch(()=>remind(true))}else remind(true)};
document.addEventListener("zpx-open",()=>remind(false));
if(!document.body.classList.contains("locked"))remind(false);
$("tg").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
</script>
</body>
</html>
